<body>
<canvas id="c"></canvas>
<div id="hint">TOCCA PER SCHERMO INTERO</div>
<script>
(() => {
  // colours: text, green, comment, light green
  const COLORS = [[240, 244, 242], [77, 190, 147], [138, 158, 149], [150, 225, 196]];
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W, H, DPR, P = [], N = 0, shapes = [], current = 0, logoBox = null;

  // ---- what the particles write: the real lines that move them --------------
  const SNIPPETS = [
    [
      '// ogni particella torna al suo posto',
      'const k = 0.9 + 5 * ease(t), d = 1.2 + 6 * ease(t);',
      'p.vx += ((p.tx - p.x) * k - p.vx * d) * dt;',
      'p.vy += ((p.ty - p.y) * k - p.vy * d) * dt;',
      'p.x += p.vx * dt; p.y += p.vy * dt;',
    ],
    [
      '// il flusso invisibile che le fa danzare',
      'const a = Math.sin(x * s + seed + t * 0.07) * 1.7',
      '        + Math.cos(y * s * 1.3 + t * 0.05) * 1.7;',
      'p.vx += (Math.cos(a) * speed - p.vx) * dt;',
      'p.vy += (Math.sin(a) * speed - p.vy) * dt;',
    ],
  ];
  const KEYWORDS = new Set(['const', 'let', 'for', 'of', 'return']);

  function tokenize(line) {                     // -> [[text, colour], ...]
    if (line.trim().startsWith('//')) return [[line, 2]];
    const out = [];
    const re = /([A-Za-z_][A-Za-z0-9_]*)|(\d+(?:\.\d+)?)|(\s+)|(.)/g;
    let m;
    while ((m = re.exec(line))) {
      if (m[1]) out.push([m[1], KEYWORDS.has(m[1]) ? 1 : (m[1] === 'sin' || m[1] === 'cos' || m[1] === 'ease') ? 3 : 0]);
      else if (m[2]) out.push([m[2], 3]);
      else if (m[3]) out.push([m[3], 0]);
      else out.push([m[4], 2]);
    }
    return out;
  }

  // ---- turn a drawing into target points ------------------------------------
  function sample(paint) {                       // paint(o, colourIndex) draws one colour group
    const off = document.createElement('canvas'), o = off.getContext('2d', { willReadFrequently: true });
    off.width = W; off.height = H;
    let pts = [];
    const step = Math.max(1, Math.round(DPR));
    for (let ci = 0; ci < COLORS.length; ci++) {
      o.clearRect(0, 0, W, H);
      o.fillStyle = '#fff';
      if (!paint(o, ci)) continue;
      const img = o.getImageData(0, 0, W, H).data;
      for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step)
        if (img[(y * W + x) * 4 + 3] > 128) pts.push([x, y, ci]);
    }
    for (let i = pts.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [pts[i], pts[j]] = [pts[j], pts[i]]; }
    return pts.slice(0, Math.round(N * 0.92));
  }

  function logoShape() {
    const size = Math.min(W * (W < H ? 0.84 : 0.5) / 5.6, H * 0.17);
    const probe = document.createElement('canvas').getContext('2d');
    probe.font = `700 ${size}px PzLogo`;
    const wP = probe.measureText('Pezzali').width, wA = probe.measureText('APP').width;
    const x0 = (W - wP - wA) / 2, base = H * 0.5 + size * 0.33;
    logoBox = { w: wP + wA, size, base };
    return { logo: true, pts: sample((o, ci) => {
      if (ci > 1) return false;
      o.font = `700 ${size}px PzLogo`;
      o.fillText(ci ? 'APP' : 'Pezzali', ci ? x0 + wP : x0, base);
      return true;
    }) };
  }

  function codeShape(lines) {
    const cols = Math.max(...lines.map(l => l.length));
    const size = Math.min(W * 0.8 / (cols * 0.6), H * 0.06);
    const lh = size * 1.55, x0 = (W - cols * size * 0.6) / 2;
    const y0 = H / 2 - (lines.length - 1) * lh / 2 + size * 0.35;
    const toks = lines.map(tokenize);
    return { logo: false, pts: sample((o, ci) => {
      o.font = `700 ${size}px PzMono`;
      let any = false;
      toks.forEach((line, li) => {
        let x = x0;
        for (const [t, c] of line) {
          if (c === ci) { o.fillText(t, x, y0 + li * lh); any = true; }
          x += o.measureText(t).width;
        }
      });
      return any;
    }) };
  }

  function setup() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(innerWidth * DPR); H = Math.round(innerHeight * DPR);
    cv.width = W; cv.height = H;
    N = Math.round(Math.min(16000, Math.max(4000, (W * H) / (DPR * DPR) / 85)));
    shapes = [logoShape(), codeShape(SNIPPETS[0]), logoShape(), codeShape(SNIPPETS[1])];
    P = [];
    for (let i = 0; i < N; i++) {
      P.push({ x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0, tx: 0, ty: 0,
               c: [...COLORS[i % 7 ? 2 : 1]], ci: 2, extra: true,
               delay: 0, s: (0.7 + Math.random() * 0.8) * DPR, ph: Math.random() * 6.283 });
    }
    assign(current);
    ctx.fillStyle = '#050709'; ctx.fillRect(0, 0, W, H);
  }

  function assign(si) {                          // give every particle a home in shape si
    const pts = shapes[si].pts;
    P.forEach((p, i) => {
      const t = pts[i];
      p.extra = !t;
      if (t) { p.tx = t[0] + (Math.random() - .5) * DPR; p.ty = t[1] + (Math.random() - .5) * DPR; p.ci = t[2]; }
      else p.ci = 2;
      p.delay = Math.random() * 1.6;
    });
  }

  // ---- timeline (seconds) ----------------------------------------------------
  const DRIFT = 7, GATHER = 4.5, HOLD = 7, RELEASE = 2;
  const CYCLE = DRIFT + GATHER + HOLD + RELEASE;
  const ease = u => u < 0 ? 0 : u > 1 ? 1 : u * u * (3 - 2 * u);

  // ---- the invisible flow ------------------------------------------------------
  let seed = Math.random() * 100;
  function flow(x, y, t) {
    const s = 0.0016 / DPR;
    return Math.sin(x * s + seed + t * 0.07) * 1.7
         + Math.cos(y * s * 1.3 + t * 0.05) * 1.7;
  }

  // ---- simulation ----------------------------------------------------------------
  let T = 0, cycleNo = 0;
  function step(dt) {
    T += dt;
    const n = Math.floor(T / CYCLE);
    if (n !== cycleNo) { cycleNo = n; current = (current + 1) % shapes.length; assign(current); seed += 1.7; }
    const ct = T % CYCLE;
    const phase = ct < DRIFT ? 0 : ct < DRIFT + GATHER ? 1 : ct < DRIFT + GATHER + HOLD ? 2 : 3;
    const pt = [ct, ct - DRIFT, ct - DRIFT - GATHER, ct - DRIFT - GATHER - HOLD][phase];
    const speed = 38 * DPR, cx = W / 2, cy = H / 2;

    for (const p of P) {
      const target = !p.extra && (phase === 1 || phase === 2);
      const want = COLORS[target || phase === 0 ? p.ci : p.ci];
      for (let k = 0; k < 3; k++) p.c[k] += (want[k] - p.c[k]) * Math.min(1, dt * 1.5);

      if (target) {
        const t = phase === 2 ? 1 : (pt - p.delay) / 2.2;
        const k = 0.9 + 5 * ease(t), d = 1.2 + 6 * ease(t);
        const a = flow(p.x, p.y, T), free = 1 - ease(t);
        p.vx += ((p.tx - p.x) * k - p.vx * d) * dt + Math.cos(a) * speed * free * dt;
        p.vy += ((p.ty - p.y) * k - p.vy * d) * dt + Math.sin(a) * speed * free * dt;
      } else {
        if (phase === 3 && pt < dt * 1.5 && !p.extra) {   // release: a soft burst
          const dx = p.x - cx, dy = p.y - cy, dd = Math.hypot(dx, dy) + 1;
          const f = (60 + Math.random() * 160) * DPR;
          p.vx += dx / dd * f; p.vy += dy / dd * f;
        }
        const a = flow(p.x, p.y, T), sp = p.extra ? speed * 0.7 : speed;
        p.vx += (Math.cos(a) * sp - p.vx) * Math.min(1, dt * 0.9);
        p.vy += (Math.sin(a) * sp - p.vy) * Math.min(1, dt * 0.9);
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.x < -20) p.x += W + 40; else if (p.x > W + 20) p.x -= W + 40;
      if (p.y < -20) p.y += H + 40; else if (p.y > H + 20) p.y -= H + 40;
    }
    return { phase, pt, ct };
  }

  // ---- drawing -------------------------------------------------------------------
  function draw(st) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = st.phase === 2 ? 'rgba(5,7,9,0.4)' : 'rgba(5,7,9,0.16)';
    ctx.fillRect(0, 0, W, H);

    const isLogo = shapes[current].logo;
    const glow = ease((st.ct - DRIFT - 1.5) / 3) * (1 - ease((st.ct - DRIFT - GATHER - HOLD + 0.5) / 2));
    if (glow > 0.01) {
      const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.4);
      g.addColorStop(0, `rgba(77,190,147,${(isLogo ? 0.05 : 0.03) * glow})`);
      g.addColorStop(1, 'rgba(77,190,147,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }

    ctx.globalCompositeOperation = 'lighter';
    const buckets = new Map();                     // group by colour+alpha: one fillStyle per group
    for (const p of P) {
      const v = Math.hypot(p.vx, p.vy) / DPR;
      const tw = 0.7 + 0.3 * Math.sin(T * 2 + p.ph);
      const formed = !p.extra && (st.phase === 2 || (st.phase === 1 && st.pt > p.delay + 1.5));
      const a = p.extra ? 0.22 * tw : formed ? 0.92 * tw : Math.min(0.9, 0.45 + v * 0.003) * tw;
      const key = ((p.c[0] >> 4) << 16 | (p.c[1] >> 4) << 8 | (p.c[2] >> 4)) * 16 + Math.min(15, a * 16 | 0);
      let b = buckets.get(key);
      if (!b) buckets.set(key, b = []);
      b.push(p);
    }
    for (const [key, list] of buckets) {
      const a = ((key % 16) + 0.5) / 16, c = Math.floor(key / 16);
      ctx.fillStyle = `rgba(${(c >> 16 & 15) * 17},${(c >> 8 & 15) * 17},${(c & 15) * 17},${a.toFixed(3)})`;
      for (const p of list) ctx.fillRect(p.x, p.y, p.s, p.s);
    }

    // the website motto, under the formed logo
    const tg = ease((st.ct - DRIFT - GATHER - 0.8) / 1.5) * (1 - ease((st.ct - DRIFT - GATHER - HOLD + 1.2) / 1));
    if (isLogo && tg > 0.01) {
      ctx.globalCompositeOperation = 'source-over';
      const fs = Math.max(12 * DPR, logoBox.size * 0.13);
      ctx.font = `700 ${fs}px PzLogo`;
      const a = 'One problem. ', b = 'One tool.';
      const wa = ctx.measureText(a).width, wb = ctx.measureText(b).width;
      const x = (W - wa - wb) / 2, y = logoBox.base + logoBox.size * 0.75;
      ctx.fillStyle = `rgba(240,244,242,${0.55 * tg})`; ctx.fillText(a, x, y);
      ctx.fillStyle = `rgba(77,190,147,${0.7 * tg})`; ctx.fillText(b, x + wa, y);
    }
  }

  // ---- run -------------------------------------------------------------------------
  let last = 0, rt;
  function frame(ts) {
    const dt = Math.min(0.05, Math.max(0.001, (ts - last) / 1000 || 0.016));
    last = ts;
    draw(step(dt));
    requestAnimationFrame(frame);
  }
  function start() {
    setup();
    const sim = parseFloat(new URLSearchParams(location.search).get('sim') || '0');
    for (let t = 0; t < sim; t += 1 / 60) draw(step(1 / 60));
    if (location.search.includes('freeze')) return;
    requestAnimationFrame(ts => { last = ts; requestAnimationFrame(frame); });
  }
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(setup, 250); });

  const hint = document.getElementById('hint');
  setTimeout(() => hint.classList.add('off'), 4000);
  addEventListener('click', () => {
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
  });
  let idle;
  addEventListener('mousemove', () => {
    document.body.classList.remove('idle');
    clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 2000);
  });

  Promise.all([document.fonts.load('700 40px PzLogo'), document.fonts.load('700 40px PzMono')])
    .catch(() => {}).then(start);
})();
</script>
</body>
</html>
